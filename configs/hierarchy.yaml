# Shared hierarchical Prompt-CAM used in the final comparison.
pretrained_weights: vit_base_patch14_dinov2
pretrained_checkpoint: ./pretrained_weights/dinov2_vitb14_pretrain.pth
promptcam_checkpoint: null
load_pretrained_backbone: true
train_type: prompt_cam
model: dinov2
class_num: 30
vpt_num: 0
vpt_mode: null
vpt_layer: null
vpt_dropout: 0.0
drop_path_rate: 0.0
hierarchical_prompt: true
taxonomy_manifest: ./data/wild30_taxonomy.csv
taxonomy_class_column: folder_name
identifiability_enabled: false
identifiability_manifest: null
missing_identifiability_policy: species
bbox_coordinate_mode: normalized
bbox_attention_gate: false
data: imagefolder
data_path: ./data/dataset/imagefolder
train_split: train
val_split: val
test_split: test
crop_size: 336
train_scale_min: 0.5
train_scale_max: 1.0
train_ratio_min: 0.75
train_ratio_max: 1.3333333333333333
eval_resize_size: 384
normalization: inception
num_workers: 8
drop_last: true
optimizer: sgd
lr: 0.001
wd: 0.001
momentum: 0.9
epoch: 60
warmup_epoch: 10
warmup_lr_init: 1.0e-06
lr_min: 1.0e-06
batch_size: 32
test_batch_size: 64
amp_dtype: bfloat16
taxonomy_objective: node_conditional
loss_family_path_weight: 1.0
loss_genus_path_weight: 1.0
loss_species_path_weight: 1.0
loss_rank_weight: 1.0
loss_localization_weight: 0.0
loss_localization_genus_weight: 1.0
loss_center_species_weight: 0.001
loss_center_genus_weight: 0.001
semantic_snapmix: true
mix_probability: 0.5
mix_beta: 1.0
eta_start_epoch: 5
eta_end_epoch: 15
ema_decay: 0.999
spm_head_reduction: mean
spm_eps: 1.0e-08
selection_metric: macro_f1
eval_freq: 5
early_patience: 15
store_ckp: true
random_seed: 42
resume: null
output_root: ./output/shared
final_run: true
debug: false
vis_attn: false
original_taxonomy_prompt: false
